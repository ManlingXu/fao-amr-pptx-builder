name: Core workflow tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run regression tests
        run: python -m pytest
      - name: Run synthetic API demonstration
        run: python scripts/run_demo.py --output build/ci-demo
      - name: Check shell syntax
        run: bash -n start-local.sh deploy-azure.sh deploy/azure-appservice.sh
