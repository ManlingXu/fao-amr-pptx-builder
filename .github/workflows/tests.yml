name: Core workflow tests

on:
  pull_request:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run regression tests
        run: python -m pytest
      - name: Run synthetic API demonstration
        run: python scripts/run_demo.py --output build/ci-demo
      - name: Run template upload and replacement demonstration
        run: python scripts/run_template_demo.py --output build/ci-template-demo
      - name: Run V2 storyline planning and revision demonstration
        run: python scripts/run_storyline_demo.py --output build/ci-storyline-demo
      - name: Check shell syntax
        run: bash -n start-local.sh deploy-azure.sh deploy/azure-appservice.sh

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare test environment and editable source decks
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[test]"
          .\.venv\Scripts\python.exe -c "import pathlib,runpy; runpy.run_path('tests/test_local_brief_workflow.py')['corpus_fixture'](pathlib.Path('build/录屏 test'))"
      - name: Start local workbench using the Windows launcher
        shell: pwsh
        run: |
          $proc = Start-Process cmd.exe -ArgumentList '/d /c start-amr.cmd "build\录屏 test\corpus"' -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              if ($proc.HasExited) { throw "Launcher exited before the workbench opened." }
              try { $homePage = Invoke-WebRequest 'http://127.0.0.1:8765/' -TimeoutSec 3 -ErrorAction Stop }
              catch { Start-Sleep -Seconds 1 }
            } until ($homePage -or (Get-Date) -gt $deadline)
            if (!$homePage -or $homePage.Content -notmatch 'demo-token') { throw "Workbench did not start." }
          }
          finally {
            if (!$proc.HasExited) { taskkill /T /F /PID $proc.Id | Out-Null }
          }
      - name: Build and download a deck with the Studio Windows launcher
        shell: pwsh
        run: |
          $root = 'http://127.0.0.1:8768'
          $proc = Start-Process cmd.exe -ArgumentList '/d /c start-studio.cmd' -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(2)
            do {
              if ($proc.HasExited) { throw 'Studio exited before startup.' }
              try { $state = Invoke-RestMethod "$root/api/session" -SessionVariable visitor -TimeoutSec 3 -ErrorAction Stop }
              catch { Start-Sleep -Seconds 1 }
            } until ($state -or (Get-Date) -gt $deadline)
            if (!$state.authenticated) { throw 'Local Studio session unavailable.' }
            $brief = @{message='Zambia antimicrobial stewardship'; settings=@{count=2; model='offline'; mode='reconstruction'}} | ConvertTo-Json
            $outline = Invoke-RestMethod "$root/api/chat" -Method Post -WebSession $visitor -ContentType 'application/json' -Body $brief
            if ($outline.slides.Count -lt 1) { throw 'No sourced slide found.' }
            $export = Invoke-RestMethod "$root/api/export" -Method Post -WebSession $visitor -ContentType 'application/json' -Body '{}'
            $deck = $export.versions[-1].files.pptx
            Invoke-WebRequest "$root$deck" -WebSession $visitor -OutFile build/studio-windows.pptx
            .\.venv\Scripts\python.exe -c "from pptx import Presentation; assert len(Presentation('build/studio-windows.pptx').slides) > 0"
            if ($LASTEXITCODE -ne 0) { throw 'Exported file could not be opened.' }
            .\stop-studio.cmd
            if ($LASTEXITCODE -ne 0 -or !$proc.WaitForExit(10000)) { throw 'Studio did not stop cleanly.' }
          } finally {
            if (!$proc.HasExited) { taskkill /T /F /PID $proc.Id | Out-Null }
          }
