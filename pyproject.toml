[project]
name = "presentation-search-backend"
version = "1.0.0"
description = "Slide-level presentation search backend for Copilot Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-pptx>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "msal>=1.31,<2",
  "PyJWT[crypto]>=2.10.1,<3",
  "lxml>=5,<7",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "httpx>=0.28,<1"
]

[tool.setuptools.packages.find]
include = ["presentation_search*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["presentation_search"]
